<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="StegoLab — securely encode and decode secret messages hidden inside images, audio files, and text."
    />
    <meta name="theme-color" content="#070b13" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>StegoLab — Hide in Plain Sight</title>
    <script>
      // Apply the persisted theme before first paint to avoid a flash.
      // Only the theme preference is ever stored (never secrets or media).
      (function () {
        try {
          var stored = localStorage.getItem("stegolab-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia &&
                  window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          var root = document.documentElement;
          root.classList.toggle("dark", theme === "dark");
          root.style.colorScheme = theme;
        } catch (e) {
          /* default dark theme stays applied */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
